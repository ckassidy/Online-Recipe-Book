<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandok - Log In</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="login-page">

  <header>
    <a class="logo" href="login.html">
      <img src="images/logo.png" alt="Sandok logo">
    </a>
  </header>

  <main>

    <div class="message-box hidden" id="message-box"></div>

    <section class="form-card login-card">

      <form id="login-form">
        <h2>Log In</h2>
        <p class="login-intro">Log in to browse and share recipes.</p>

        <label for="login-email">Email*</label>
        <input type="email" id="login-email" placeholder="Enter your email" required>

        <label for="login-password">Password*</label>
        <input type="password" id="login-password" placeholder="Enter your password" required>

        <p class="form-message hidden" id="login-message"></p>

        <button type="submit" class="btn-orange login-btn">Log In</button>

        <p class="switch-text">No account yet? <a href="signup.html" id="show-signup">Sign up</a></p>
      </form>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sandok</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
