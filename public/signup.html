<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandok - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="signup-page">

  <header>
    <a class="logo" href="login.html">
      <img src="images/logo.png" alt="Sandok logo">
    </a>
  </header>

  <main>

    <div class="message-box hidden" id="message-box"></div>

    <section class="form-card login-card">

      <form id="signup-form">
        <h2>Sign Up</h2>
        <p class="login-intro">Create an account to start sharing recipes.</p>

        <label for="signup-name">Name*</label>
        <input type="text" id="signup-name" placeholder="Enter your name" required>

        <label for="signup-email">Email*</label>
        <input type="email" id="signup-email" placeholder="Enter your email" required>

        <label for="signup-password">Password* (at least 6 characters)</label>
        <input type="password" id="signup-password" placeholder="Create a password" minlength="6" required>

        <label for="signup-confirm">Confirm Password*</label>
        <input type="password" id="signup-confirm" placeholder="Type the password again" required>

        <p class="form-message hidden" id="signup-message"></p>

        <button type="submit" class="btn-orange login-btn">Create Account</button>

        <p class="switch-text">Already have an account? <a href="login.html" id="show-login">Log in</a></p>
      </form>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sandok</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
